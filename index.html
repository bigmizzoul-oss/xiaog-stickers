<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小G公主 · 表情包图鉴</title><style>body{background:#f9f5ff;color:#3c2655;font-family:system-ui,sans-serif;max-width:1100px;margin:0 auto;padding:24px}h1{text-align:center}.sub{text-align:center}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:30px}.card{background:white;border:1px solid #eee2fa;border-radius:16px;overflow:hidden;text-align:center;padding:10px;box-shadow:0 3px 12px #2f17490d}.card img{width:100%;aspect-ratio:1;object-fit:contain}.card a{color:#6e4aa5;text-decoration:none;font-weight:600}.card span{display:block;font-size:12px;margin:8px;color:#887a9a}footer{text-align:center;margin-top:32px;color:#807590}</style></head><body><h1>🐉 小G公主 · 表情包图鉴 💜</h1><p class="sub">24 张白龙娘表情包 · 点击名称查看图片原链接</p><main id="grid"></main><footer>每张图片均为独立 PNG，可长期按编号引用</footer><script>fetch('stickers.json').then(r=>r.json()).then(d=>{document.querySelector('#grid').innerHTML=d.stickers.map(x=>`<div class="card"><a href="${x.file}"><img src="${x.file}" loading="lazy" alt="${x.name}">${x.name}</a><span>#${x.id}</span></div>`).join('')})</script></body></html>
